steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest'
      - '.'
    id: Build

  # Push image (commit SHA tag)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
    id: Push

  # Push image (latest tag)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest'
    id: PushLatest

  # Deploy to Cloud Run
  # Runtime env vars (see .env.example), passed via substitutions for now — TODO: move
  # DATABASE_URL / FIREBASE_PRIVATE_KEY / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY /
  # CRON_SECRET to Secret Manager + `--set-secrets` once that's set up (these are live
  # credentials; substitution values are plaintext in the trigger config and build log).
  # CLIENT_URL must be this environment's actual deployed frontend origin
  # (e.g. https://framed-frontend-xyz.run.app) — CORS is wide open if it's left unset.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=$_PLATFORM'
      - '--set-env-vars=DATABASE_URL=$_DATABASE_URL,FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL=$_FIREBASE_CLIENT_EMAIL,FIREBASE_PRIVATE_KEY=$_FIREBASE_PRIVATE_KEY,R2_ACCESS_KEY_ID=$_R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY=$_R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME=$_R2_BUCKET_NAME,R2_ENDPOINT=$_R2_ENDPOINT,R2_PUBLIC_URL=$_R2_PUBLIC_URL,CRON_SECRET=$_CRON_SECRET,CLIENT_URL=$_CLIENT_URL'
    id: Deploy

images:
  - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest'

substitutions:
  _AR_HOSTNAME: 'asia-southeast1-docker.pkg.dev'
  # PROJECT_ID is NOT listed here — it's a Cloud Build built-in variable (auto-filled from
  # whichever project the trigger runs in), referenced directly as $PROJECT_ID above.
  _AR_REPOSITORY: 'picsweep-repository'
  _SERVICE_NAME: 'framed-backend'
  _DEPLOY_REGION: 'asia-southeast1'
  _PLATFORM: 'managed'
  # Runtime env vars — empty by default (build fails fast rather than silently deploying
  # with blank config if you forget one). Set real values per-trigger/per-environment via
  # --substitutions or the trigger's UI; never commit real values here (git history is
  # forever, worse than a build log).
  _DATABASE_URL: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_CLIENT_EMAIL: ''
  _FIREBASE_PRIVATE_KEY: ''
  _R2_ACCESS_KEY_ID: ''
  _R2_SECRET_ACCESS_KEY: ''
  _R2_BUCKET_NAME: ''
  _R2_ENDPOINT: ''
  _R2_PUBLIC_URL: ''
  _CRON_SECRET: ''
  _CLIENT_URL: ''

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
